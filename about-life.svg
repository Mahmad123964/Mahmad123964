<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="1" stop-color="#111629"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>

  <!-- header -->
  <text x="60" y="62" fill="#67e8f9" font-family="Arial" font-size="15" font-weight="700"
        letter-spacing="3">ABOUT • LIFE • WORK</text>
  <text x="60" y="105" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="800">
    What I Build
  </text>
  <rect x="60" y="124" width="1080" height="2" fill="url(#line)" opacity=".7"/>

  <!-- left: work -->
  <g transform="translate(60 160)">
    <rect width="520" height="325" rx="26" fill="#0b1020" stroke="#27324a"/>
    <circle cx="42" cy="44" r="22" fill="#0e2430" stroke="#22d3ee"/>
    <text x="34" y="52" fill="#67e8f9" font-family="monospace" font-size="20">&lt;/&gt;</text>

    <text x="78" y="50" fill="#e2e8f0" font-family="Arial" font-size="22" font-weight="700">
      Software Engineering
    </text>

    <text x="32" y="94" fill="#94a3b8" font-family="Arial" font-size="16">
      I like turning ideas into working software.
    </text>

    <g font-family="Arial">
      <rect x="32" y="125" width="216" height="62" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="50" y="151" fill="#67e8f9" font-size="14" font-weight="700">WEB DEVELOPMENT</text>
      <text x="50" y="174" fill="#94a3b8" font-size="13">HTML • CSS • JS • React</text>

      <rect x="268" y="125" width="220" height="62" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-opacity=".55"/>
      <text x="286" y="151" fill="#c4b5fd" font-size="14" font-weight="700">SOFTWARE</text>
      <text x="286" y="174" fill="#94a3b8" font-size="13">Java • C/C++ • Python</text>

      <rect x="32" y="204" width="216" height="62" rx="16" fill="#0f172a" stroke="#ec4899" stroke-opacity=".55"/>
      <text x="50" y="230" fill="#f9a8d4" font-size="14" font-weight="700">QUALITY</text>
      <text x="50" y="253" fill="#94a3b8" font-size="13">SQA • API • Playwright</text>

      <rect x="268" y="204" width="220" height="62" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="286" y="230" fill="#67e8f9" font-size="14" font-weight="700">DELIVERY</text>
      <text x="286" y="253" fill="#94a3b8" font-size="13">Jenkins • CI/CD</text>
    </g>
  </g>

  <!-- right: hobbies carousel -->
  <g transform="translate(620 160)">
    <rect width="520" height="325" rx="26" fill="#0b1020" stroke="#27324a"/>
    <text x="32" y="50" fill="#e2e8f0" font-family="Arial" font-size="22" font-weight="700">
      Outside the Code
    </text>
    <text x="32" y="78" fill="#64748b" font-family="Arial" font-size="13">
      A few things that keep me balanced.
    </text>

    <!-- Coding -->
    <g>
      <g opacity="1">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.25;.32;.95;1" dur="9s" repeatCount="indefinite"/>
        <circle cx="100" cy="160" r="52" fill="#0e2430" stroke="#22d3ee" stroke-width="2"/>
        <text x="74" y="175" fill="#67e8f9" font-family="monospace" font-size="34">&lt;/&gt;</text>
        <text x="177" y="153" fill="#f8fafc" font-family="Arial" font-size="24" font-weight="700">Coding</text>
        <text x="177" y="180" fill="#94a3b8" font-family="Arial" font-size="14">Building, learning,</text>
        <text x="177" y="201" fill="#94a3b8" font-family="Arial" font-size="14">experimenting.</text>
      </g>
    </g>

    <!-- Reading -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.30;.37;.60;.68" dur="9s" repeatCount="indefinite"/>
      <rect x="54" y="112" width="92" height="96" rx="12" fill="#15112a" stroke="#8b5cf6" stroke-width="2"/>
      <path d="M69 133 Q100 121 131 133 L131 193 Q100 181 69 193 Z" fill="#c4b5fd" opacity=".9"/>
      <path d="M100 130 V187" stroke="#8b5cf6" stroke-width="3"/>
      <text x="177" y="153" fill="#f8fafc" font-family="Arial" font-size="24" font-weight="700">Reading</text>
      <text x="177" y="180" fill="#94a3b8" font-family="Arial" font-size="14">Exploring ideas,</text>
      <text x="177" y="201" fill="#94a3b8" font-family="Arial" font-size="14">stories and knowledge.</text>
    </g>

    <!-- Gaming -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.63;.70;.93;1" dur="9s" repeatCount="indefinite"/>
      <rect x="48" y="125" width="104" height="68" rx="28" fill="#191126" stroke="#ec4899" stroke-width="2"/>
      <circle cx="78" cy="158" r="7" fill="#f9a8d4"/>
      <circle cx="122" cy="151" r="5" fill="#f9a8d4"/>
      <circle cx="133" cy="164" r="5" fill="#f9a8d4"/>
      <path d="M91 163 h-18 M82 154 v18" stroke="#f9a8d4" stroke-width="4" stroke-linecap="round"/>
      <text x="177" y="153" fill="#f8fafc" font-family="Arial" font-size="24" font-weight="700">Gaming</text>
      <text x="177" y="180" fill="#94a3b8" font-family="Arial" font-size="14">Relaxing, competing,</text>
      <text x="177" y="201" fill="#94a3b8" font-family="Arial" font-size="14">and having fun.</text>
    </g>

    <!-- carousel indicators -->
    <g transform="translate(200 270)">
      <circle cx="0" cy="0" r="5" fill="#22d3ee">
        <animate attributeName="opacity" values="1;.3;1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="28" cy="0" r="5" fill="#8b5cf6"/>
      <circle cx="56" cy="0" r="5" fill="#ec4899"/>
    </g>
    <text x="32" y="298" fill="#475569" font-family="monospace" font-size="11">
      CODING • READING • GAMING
    </text>
  </g>

  <!-- footer -->
  <text x="60" y="525" fill="#64748b" font-family="monospace" font-size="12">
    ENGINEERING • QUALITY • AUTOMATION
  </text>
  <text x="1140" y="525" text-anchor="end" fill="#475569" font-family="monospace" font-size="12">
    02 / ABOUT
  </text>
</svg>
